version: '3.9'

services:

  backend:
    build: ./backend
    container_name: ai_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: ai_frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app

    stdin_open: true
    tty: true

    depends_on:
      - backend

  postgres:
    image: postgres:15

    container_name: ai_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: interview_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: